name: KirinYT Baseline Merge Progress Test

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci-baseline-merge-test.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle
      - run: |
          touch local.properties
          chmod +x gradlew
      - run: ./gradlew assembleGithubDebug --warning-mode all
