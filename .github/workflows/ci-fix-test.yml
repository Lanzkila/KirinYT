name: KirinYT Fix Build Test

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci-fix-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle

      - name: Prepare Gradle
        run: |
          touch local.properties
          chmod +x gradlew

      - name: Build GitHub debug APK
        run: ./gradlew assembleGithubDebug --warning-mode all
