name: KirinYT Telegram Release Notification

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Prepare release message
        shell: bash
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          MAX_LENGTH=3000
          BODY="${RELEASE_BODY:-No release notes provided.}"
          if [ ${#BODY} -gt $MAX_LENGTH ]; then
            BODY="${BODY:0:$MAX_LENGTH}... (truncated)"
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            CHANNEL="Pre-release"
          else
            CHANNEL="Release"
          fi

          ASSET_LINKS=$(jq -r '.release.assets[]? | "• [\(.name)](\(.browser_download_url))"' "$GITHUB_EVENT_PATH")
          if [ -z "$ASSET_LINKS" ]; then
            ASSET_LINKS="No uploaded APK assets were found."
          fi

          {
            echo 'RELEASE_BODY_TRUNCATED<<KIRINYT_EOF'
            echo "$BODY"
            echo 'KIRINYT_EOF'
            echo 'RELEASE_ASSET_LINKS<<KIRINYT_EOF'
            echo "$ASSET_LINKS"
            echo 'KIRINYT_EOF'
            echo "RELEASE_CHANNEL=$CHANNEL"
          } >> "$GITHUB_ENV"

      - name: Send KirinYT release to Telegram
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          photo: https://raw.githubusercontent.com/${{ github.repository }}/main/app/src/main/ic_launcher-playstore.png
          disable_web_page_preview: false
          message: |
            *KirinYT ${{ env.RELEASE_CHANNEL }}*
            [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }})

            ${{ env.RELEASE_BODY_TRUNCATED }}

            *Downloads*
            ${{ env.RELEASE_ASSET_LINKS }}
