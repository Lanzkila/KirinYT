name: KirinYT Auto Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: kirinyt-auto-changelog
  cancel-in-progress: false

jobs:
  changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update KirinYT changelog
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          from __future__ import annotations

          import datetime as dt
          import os
          import re
          import subprocess
          from pathlib import Path

          CHANGELOG = Path("CHANGELOG.md")
          START = "<!-- KIRINYT-AUTO-CHANGELOG:START -->"
          END = "<!-- KIRINYT-AUTO-CHANGELOG:END -->"
          LAST_RE = re.compile(r"<!-- KIRINYT-AUTO-CHANGELOG-LAST: ([0-9a-f]{7,40}) -->")

          def git(*args: str, check: bool = True) -> str:
              result = subprocess.run(
                  ["git", *args],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=check,
              )
              return result.stdout.strip()

          def excluded_path(path: str) -> bool:
              lower = path.lower()
              return (
                  lower == "changelog.md"
                  or lower == "license"
                  or lower.startswith("readme")
                  or lower.startswith(".github/")
                  or lower.startswith("fastlane/metadata/")
                  or lower.startswith(".idea/")
                  or lower.startswith(".kotlin/")
                  or lower.startswith("docs/")
                  or lower in {"contributing.md", "security.md"}
              )

          def commit_is_app_change(sha: str) -> bool:
              files = [
                  line.strip()
                  for line in git("diff-tree", "--no-commit-id", "--name-only", "-r", sha).splitlines()
                  if line.strip()
              ]
              return bool(files) and any(not excluded_path(path) for path in files)

          def clean_subject(subject: str) -> str:
              subject = subject.strip()
              subject = re.sub(
                  r"^(feat|fix|refactor|perf|build|chore)(\([^)]*\))?!?:\s*",
                  "",
                  subject,
                  flags=re.IGNORECASE,
              )
              if not subject:
                  return subject
              return subject[0].upper() + subject[1:]

          text = CHANGELOG.read_text(encoding="utf-8")
          if not text.startswith("# KirinYT Changelog"):
              raise SystemExit("CHANGELOG.md does not use the KirinYT changelog format.")

          current = git("rev-parse", "HEAD")
          now = dt.datetime.now(dt.timezone.utc)
          month = now.strftime("%Y-%m")
          event = os.environ.get("EVENT_NAME", "")

          if START not in text or END not in text:
              block = (
                  f"{START}\n"
                  f"<!-- KIRINYT-AUTO-CHANGELOG-LAST: {current} -->\n"
                  f"> # Unreleased ({month})\n\n"
                  "# What's Changed\n\n"
                  "## Automated changes\n\n"
                  f"{END}\n\n"
              )
              text = text.replace("# KirinYT Changelog\n", "# KirinYT Changelog\n\n" + block, 1)

          start = text.index(START)
          end = text.index(END, start) + len(END)
          block = text[start:end]

          if event == "release":
              prerelease = os.environ.get("RELEASE_PRERELEASE", "").lower() == "true"
              if prerelease:
                  print("Pre-release detected; stable changelog section remains open.")
                  raise SystemExit(0)

              tag = os.environ.get("RELEASE_TAG", "").strip()
              if not tag:
                  raise SystemExit("Stable release event has no tag.")
              version = tag[1:] if tag.lower().startswith("v") else tag

              finalized = re.sub(
                  r"> # Unreleased \(\d{4}-\d{2}\)",
                  f"> # {version} ({month})",
                  block,
                  count=1,
              )
              finalized = re.sub(
                  r"\n?<!-- KIRINYT-AUTO-CHANGELOG-LAST: [0-9a-f]{7,40} -->\n?",
                  "\n",
                  finalized,
                  count=1,
              )
              finalized = finalized.replace(START + "\n", "", 1).replace("\n" + END, "", 1).strip()

              fresh = (
                  f"{START}\n"
                  f"<!-- KIRINYT-AUTO-CHANGELOG-LAST: {current} -->\n"
                  f"> # Unreleased ({month})\n\n"
                  "# What's Changed\n\n"
                  "## Automated changes\n\n"
                  f"{END}"
              )
              text = text[:start] + fresh + "\n\n" + finalized + text[end:]
              CHANGELOG.write_text(text.rstrip() + "\n", encoding="utf-8")
              print(f"Finalized changelog section for {version}.")
              raise SystemExit(0)

          last_match = LAST_RE.search(block)
          last = last_match.group(1) if last_match else current

          ancestor = subprocess.run(
              ["git", "merge-base", "--is-ancestor", last, current],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0

          if last == current:
              print("No new commits to record.")
              raise SystemExit(0)

          if ancestor:
              shas = [
                  s for s in git("rev-list", "--reverse", "--no-merges", f"{last}..{current}").splitlines()
                  if s
              ]
          else:
              shas = [current]

          new_items: list[str] = []
          for sha in shas:
              subject = git("show", "-s", "--format=%s", sha)
              if subject.lower().startswith("chore(changelog):"):
                  continue
              if not commit_is_app_change(sha):
                  continue
              subject = clean_subject(subject)
              if subject:
                  new_items.append(subject)

          if not new_items:
              print("Only documentation/workflow changes detected; changelog unchanged.")
              raise SystemExit(0)

          existing = {
              line[2:].strip()
              for line in block.splitlines()
              if line.startswith("- ")
          }
          unique_items = [item for item in new_items if item not in existing]

          block = LAST_RE.sub(
              f"<!-- KIRINYT-AUTO-CHANGELOG-LAST: {current} -->",
              block,
              count=1,
          )
          block = re.sub(
              r"> # Unreleased \(\d{4}-\d{2}\)",
              f"> # Unreleased ({month})",
              block,
              count=1,
          )

          if unique_items:
              insert_at = block.rfind(END)
              prefix = block[:insert_at].rstrip()
              suffix = block[insert_at:]
              bullets = "\n".join(f"- {item}" for item in unique_items)
              if "## Automated changes" not in prefix:
                  prefix += "\n\n## Automated changes"
              block = prefix + "\n" + bullets + "\n\n" + suffix

          text = text[:start] + block + text[end:]
          CHANGELOG.write_text(text.rstrip() + "\n", encoding="utf-8")
          print(f"Recorded {len(unique_items)} app change(s).")
          PY

      - name: Commit changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            git add CHANGELOG.md
            git commit -m "chore(changelog): finalize ${VERSION} [skip ci]"
          else
            git add CHANGELOG.md
            git commit -m "chore(changelog): update unreleased changes [skip ci]"
          fi

          git push origin HEAD:main
