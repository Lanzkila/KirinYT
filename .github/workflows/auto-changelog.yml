name: KirinYT Changelog Tracker

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/auto-changelog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kirinyt-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build KirinYT auto changelog
        shell: bash
        run: |
          set -euo pipefail
          export TZ='Asia/Kuala_Lumpur'

          TRACKED_GIT=(
            ':(glob)app/**'
            '*.gradle'
            'gradle.properties'
            'settings.gradle'
            ':(glob)gradle/**'
          )

          AUTO_FILE="$RUNNER_TEMP/kirinyt-auto-changelog.md"

          {
            echo '<!-- KIRINYT-TRACKER-CHANGELOG:START -->'
            echo '# 📋 KirinYT Auto Changelog'
            echo
            echo '> Automatically generated by **KirinYT Changelog Tracker** from Git history.'
            echo
            echo "_Generated: $(date +'%d %b %Y • %H:%M MYT')_"
            echo
          } > "$AUTO_FILE"

          CHANGE_COUNT=0
          while IFS= read -r HASH; do
            [[ -n "$HASH" ]] || continue

            SHORT=$(git rev-parse --short=7 "$HASH")
            MESSAGE=$(git show -s --format='%s' "$HASH")
            AUTHOR=$(git show -s --format='%an' "$HASH")
            TS=$(git show -s --format='%at' "$HASH")
            DATE_LOCAL=$(TZ='Asia/Kuala_Lumpur' date -d "@$TS" +'%d %b %Y • %H:%M MYT')

            {
              echo "## $DATE_LOCAL — `$SHORT`"
              echo
              echo "**$MESSAGE**  "
              echo "By **$AUTHOR** • [View commit](https://github.com/$GITHUB_REPOSITORY/commit/$HASH)"
              echo
            } >> "$AUTO_FILE"

            CHANGE_LINES=0
            while IFS=$'\t' read -r STATUS A B; do
              [[ -n "${STATUS:-}" ]] || continue

              case "$STATUS" in
                A*) LABEL='➕ Added'; FILE="$A" ;;
                D*) LABEL='➖ Deleted'; FILE="$A" ;;
                M*) LABEL='✏️ Updated'; FILE="$A" ;;
                R*) LABEL='🔀 Renamed'; FILE="$A → $B" ;;
                C*) LABEL='📑 Copied'; FILE="$A → $B" ;;
                *)  LABEL='🔧 Changed'; FILE="$A" ;;
              esac

              echo "- $LABEL: `$FILE`" >> "$AUTO_FILE"
              CHANGE_LINES=$((CHANGE_LINES + 1))
              (( CHANGE_LINES >= 25 )) && break
            done < <(
              git diff-tree --root --no-commit-id --name-status -r -M "$HASH" -- "${TRACKED_GIT[@]}"
            )

            (( CHANGE_LINES == 0 )) && echo '- _No tracked app-file details available._' >> "$AUTO_FILE"
            echo >> "$AUTO_FILE"

            CHANGE_COUNT=$((CHANGE_COUNT + 1))
            (( CHANGE_COUNT >= 15 )) && break
          done < <(git log -n 15 --format='%H' -- "${TRACKED_GIT[@]}")

          if (( CHANGE_COUNT == 0 )); then
            echo '_No tracked KirinYT app changes yet._' >> "$AUTO_FILE"
            echo >> "$AUTO_FILE"
          fi

          echo '<!-- KIRINYT-TRACKER-CHANGELOG:END -->' >> "$AUTO_FILE"

          python3 <<'PY'
          from pathlib import Path
          import re

          changelog = Path("CHANGELOG.md")
          auto_file = Path(__import__("os").environ["RUNNER_TEMP"]) / "kirinyt-auto-changelog.md"

          old = changelog.read_text(encoding="utf-8") if changelog.exists() else ""
          auto = auto_file.read_text(encoding="utf-8").rstrip()

          new_start = "<!-- KIRINYT-TRACKER-CHANGELOG:START -->"
          new_end = "<!-- KIRINYT-TRACKER-CHANGELOG:END -->"
          old_start = "<!-- KIRINYT-AUTO-CHANGELOG:START -->"
          old_end = "<!-- KIRINYT-AUTO-CHANGELOG:END -->"

          legacy = old

          if new_start in legacy and new_end in legacy:
              legacy = legacy.split(new_end, 1)[1]
          elif old_start in legacy and old_end in legacy:
              before, rest = legacy.split(old_start, 1)
              _, after = rest.split(old_end, 1)
              legacy = before + after

          legacy = legacy.strip()

          # Remove old top-level changelog headers so the new tracker header is canonical.
          legacy = re.sub(r"^#\s+KirinYT Changelog\s*", "", legacy, count=1, flags=re.I)
          legacy = re.sub(r"^#\s+📚\s+Previous KirinYT Release Notes\s*", "", legacy, count=1, flags=re.I)
          legacy = legacy.strip()

          result = auto
          if legacy:
              result += "\n\n---\n\n# 📚 Previous KirinYT Release Notes\n\n" + legacy

          changelog.write_text(result.rstrip() + "\n", encoding="utf-8")
          PY

      - name: Commit & push changelog
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- CHANGELOG.md; then
            echo 'CHANGELOG.md is already up to date.'
            exit 0
          fi

          git config --local user.email 'action@github.com'
          git config --local user.name 'Kirin-Bot'
          git add CHANGELOG.md
          git commit -m 'KirinYT Changelog Tracker: update CHANGELOG.md [skip ci]'
          git push origin main
