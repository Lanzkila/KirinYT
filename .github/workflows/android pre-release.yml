name: KirinYT Pre-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Beta tag. Leave blank to use the version from app/build.gradle (example: v1.9.0-beta)"
        required: false
        type: string
      title:
        description: "Pre-release title. Leave blank for KirinYT <version> Beta"
        required: false
        type: string

permissions:
  contents: write

env:
  MAIN_PROJECT_MODULE: app

concurrency:
  group: kirinyt-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    name: Build and publish beta pre-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle

      - name: Prepare Kirin release signing
        shell: bash
        env:
          KIRIN_KEYSTORE_BASE64: ${{ secrets.KIRIN_KEYSTORE_BASE64 }}
          KIRIN_KEYSTORE_PASSWORD: ${{ secrets.KIRIN_KEYSTORE_PASSWORD }}
          KIRIN_KEY_ALIAS: ${{ secrets.KIRIN_KEY_ALIAS }}
          KIRIN_KEY_PASSWORD: ${{ secrets.KIRIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KIRIN_KEYSTORE_BASE64 KIRIN_KEYSTORE_PASSWORD KIRIN_KEY_ALIAS KIRIN_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done

          printf '%s' "$KIRIN_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/kirin-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/kirin-release.jks"

          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=../kirin-release.jks\nstorePassword=%s\n' \
            "$KIRIN_KEY_ALIAS" "$KIRIN_KEY_PASSWORD" "$KIRIN_KEYSTORE_PASSWORD" \
            > "$GITHUB_WORKSPACE/keystore.properties"

          touch "$GITHUB_WORKSPACE/local.properties"
          chmod +x gradlew

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/kirin-release.jks" \
            -storepass "$KIRIN_KEYSTORE_PASSWORD" \
            -alias "$KIRIN_KEY_ALIAS" >/dev/null

          echo "Kirin release keystore is valid."

      - name: Force beta build
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/^def isBeta = .*/def isBeta = true/' app/build.gradle

      - name: Resolve KirinYT beta version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail

          MAJOR=$(sed -nE 's/^def versionMajor = ([0-9]+).*/\1/p' app/build.gradle | head -1)
          MINOR=$(sed -nE 's/^def versionMinor = ([0-9]+).*/\1/p' app/build.gradle | head -1)
          PATCH=$(sed -nE 's/^def versionPatch = ([0-9]+).*/\1/p' app/build.gradle | head -1)
          BUILD=$(sed -nE 's/^def versionBuild = ([0-9]+).*/\1/p' app/build.gradle | head -1)

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if [ "$BUILD" -gt 0 ]; then
            VERSION="${VERSION}.${BUILD}"
          fi
          VERSION="${VERSION}-beta"

          EXPECTED_TAG="v${VERSION}"
          TAG="${INPUT_TAG:-$EXPECTED_TAG}"

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag mismatch: this beta build is ${EXPECTED_TAG}, but workflow received ${TAG}."
            echo "Update the version/versionBuild in app/build.gradle or leave the tag field blank."
            exit 1
          fi

          TITLE="${INPUT_TITLE:-KirinYT ${VERSION%-beta} Beta}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Build KirinYT beta APKs
        run: ./gradlew assembleGithubRelease --warning-mode all

      - name: Verify Kirin APK signatures
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          while IFS= read -r -d '' apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done < <(find app/build/outputs/apk/github/release -type f -name 'KirinYT-*.apk' -print0)

      - name: Verify APKs and create checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="${MAIN_PROJECT_MODULE}/build/outputs/apk/github/release"

          mapfile -t APKS < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -name 'KirinYT-*-beta-*.apk' -print | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No KirinYT beta APKs were generated."
            exit 1
          fi

          (cd "$OUTPUT_DIR" && sha256sum KirinYT-*-beta-*.apk > SHA256SUMS.txt)
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Publish KirinYT pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.title }}
          prerelease: true
          draft: false
          make_latest: false
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.output_dir }}/KirinYT-*-beta-*.apk
            ${{ steps.assets.outputs.output_dir }}/SHA256SUMS.txt

      - name: Remove Kirin signing material
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/kirin-release.jks"
          rm -f "$GITHUB_WORKSPACE/keystore.properties"
