name: KirinYT Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable tag. Leave blank to use the version from app/build.gradle (example: v1.9.0)"
        required: false
        type: string
      title:
        description: "Release title. Leave blank for KirinYT <version>"
        required: false
        type: string

permissions:
  contents: write

env:
  MAIN_PROJECT_MODULE: app

concurrency:
  group: kirinyt-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish stable release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle

      - name: Configure signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          KEYSTORE_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEY" ]; then
            echo "Missing secret: BASE_64_SIGNING_KEY"
            exit 1
          fi

          if [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "Missing secret: LOCAL_PROPERTIES"
            exit 1
          fi

          echo "$SIGNING_KEY" | base64 --decode > app/release_keystore.jks
          printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties
          touch local.properties
          chmod +x gradlew

      - name: Force stable build
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/^def isBeta = .*/def isBeta = false/' app/build.gradle

      - name: Resolve KirinYT version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail

          MAJOR=$(sed -nE 's/^def versionMajor = ([0-9]+).*/\1/p' app/build.gradle | head -1)
          MINOR=$(sed -nE 's/^def versionMinor = ([0-9]+).*/\1/p' app/build.gradle | head -1)
          PATCH=$(sed -nE 's/^def versionPatch = ([0-9]+).*/\1/p' app/build.gradle | head -1)
          BUILD=$(sed -nE 's/^def versionBuild = ([0-9]+).*/\1/p' app/build.gradle | head -1)

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if [ "$BUILD" -gt 0 ]; then
            VERSION="${VERSION}.${BUILD}"
          fi

          EXPECTED_TAG="v${VERSION}"
          TAG="${INPUT_TAG:-$EXPECTED_TAG}"

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag mismatch: app/build.gradle builds ${EXPECTED_TAG}, but workflow received ${TAG}."
            echo "Update the version in app/build.gradle or leave the tag field blank."
            exit 1
          fi

          TITLE="${INPUT_TITLE:-KirinYT ${VERSION}}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Build KirinYT GitHub release APKs
        run: ./gradlew assembleGithubRelease --warning-mode all

      - name: Verify APKs and create checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="${MAIN_PROJECT_MODULE}/build/outputs/apk/github/release"

          mapfile -t APKS < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -name 'KirinYT-*.apk' -print | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No KirinYT APKs were generated."
            exit 1
          fi

          (cd "$OUTPUT_DIR" && sha256sum KirinYT-*.apk > SHA256SUMS.txt)
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Publish KirinYT stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.title }}
          prerelease: false
          draft: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## KirinYT 1.9.2

            This release consolidates the recent KirinYT fixes into one stable build.

            ### Stability and Settings
            - Hardened Settings search/indexing so one broken or stale preference cannot close the app.
            - Removed the stale Shizuku Settings hook from the user-controlled update flow.
            - Stale multi-select preference values are handled safely after upgrading from older builds.
            - App icon changes no longer force-recreate the Settings activity.

            ### YouTube and YouTube Music API feeds
            - Added a Settings field for your own YouTube Data API v3 key.
            - Added an in-app API key test action.
            - Added separate YouTube and YouTube Music home feed options.
            - API keys are masked in Settings, excluded from backups, and redacted from network logs.

            ### Universal APK and update flow
            - KirinYT now prefers the Universal APK first when an app update is available.
            - App and runtime-package APK downloads use Android DownloadManager and remain user-controlled.
            - The GitHub release build no longer declares REQUEST_INSTALL_PACKAGES or the Shizuku installer provider.
            - Universal, ARM64, ARMv7, x86 and x86_64 APKs remain available on GitHub Releases.

            ### Launcher icons
            - Restored the full Kirin dragon artwork instead of flat tint-only launcher graphics.
            - Added detailed Light, Dark, Blue and Green Kirin variants while preserving the dragon detail.
            - Adaptive and legacy launcher resources now use the correct Kirin artwork variants.
            - Launcher alias switching enables the new icon before disabling the previous one.

            ### Download progress
            - Keeps phase-aware Video, Audio and Fragment progress.
            - Adds real Merging and Processing percentage, speed and ETA when FFmpeg timing data is available.
            - Falls back to indeterminate progress instead of showing a fake 100%.

          files: |
            ${{ steps.assets.outputs.output_dir }}/KirinYT-*.apk
            ${{ steps.assets.outputs.output_dir }}/SHA256SUMS.txt
